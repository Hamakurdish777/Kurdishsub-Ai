<!DOCTYPE html>
<html lang="ku">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KurdSub AI</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #0f172a;
      color: white;
      text-align: center;
      padding: 40px 20px;
    }

    h1 {
      font-size: 40px;
    }

    p {
      color: #94a3b8;
    }

    .box {
      max-width: 550px;
      margin: 40px auto;
      background: #1e293b;
      padding: 25px;
      border-radius: 20px;
    }

    input {
      width: 100%;
      padding: 15px;
      box-sizing: border-box;
      border-radius: 10px;
      border: none;
      font-size: 16px;
      margin-bottom: 15px;
    }

    button {
      width: 100%;
      padding: 15px;
      border: none;
      border-radius: 10px;
      background: #22c55e;
      color: white;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
    }

    #result {
      margin-top: 20px;
      color: #22c55e;
    }
  </style>
</head>

<body>

  <h1>🎬 KurdSub AI</h1>

  <p>ژێرنووسی ڤیدیۆکان بکە بە کوردی سۆرانی</p>

  <div class="box">

    <input
      id="youtubeUrl"
      type="text"
      placeholder="لینکی YouTube لێرە دابنێ..."
    >

    <button onclick="translateVideo()">
      وەرگێڕان بۆ کوردی
    </button>

    <div id="result"></div>

  </div>

  <script>
    async function translateVideo() {
      const input = document.getElementById("youtubeUrl");
      const result = document.getElementById("result");

      const videoUrl = input.value.trim();

      if (!videoUrl) {
        result.textContent = "تکایە لینکی YouTube دابنێ.";
        return;
      }

      result.textContent = "⏳ لینکەکە پشکنین دەکرێت...";

      try {
        const response = await fetch(
          "https://kurdishsub-ai.mahammadsaadi789.workers.dev/api?url=" +
          encodeURIComponent(videoUrl)
        );

        const data = await response.json();

        if (data.success) {
          result.textContent =
            "✅ لینکەکە وەرگیرا — Video ID: " + data.videoId;
        } else {
          result.textContent = "❌ " + data.error;
        }

      } catch (error) {
        result.textContent =
          "❌ کێشەیەک ڕوویدا. دووبارە هەوڵ بدەرەوە.";
      }
    }
  </script>

</body>
</html>
