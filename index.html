<!DOCTYPE html>
<html lang="ku">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KurdSub AI</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #0f172a;
      color: white;
      text-align: center;
      padding: 40px 20px;
    }

    h1 {
      font-size: 40px;
    }

    p {
      color: #94a3b8;
    }

    .box {
      max-width: 550px;
      margin: 40px auto;
      background: #1e293b;
      padding: 25px;
      border-radius: 20px;
    }

    input {
      width: 100%;
      padding: 15px;
      box-sizing: border-box;
      border-radius: 10px;
      border: none;
      font-size: 16px;
      margin-bottom: 15px;
    }

    button {
      width: 100%;
      padding: 15px;
      border: none;
      border-radius: 10px;
      background: #22c55e;
      color: white;
      font-size: 17px;
      font-weight: bold;
    }
  </style>
</head>

<body>

  <h1>🎬 KurdSub AI</h1>

  <p>ژێرنووسی ڤیدیۆکان بکە بە کوردی سۆرانی</p>

  <div class="box">

    <input
      type="text"
      placeholder="لینکی YouTube لێرە دابنێ..."
    >

    <button>
      وەرگێڕان بۆ کوردی
    </button>

  </div>

</body>
</html>
