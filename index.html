<!DOCTYPE html>
<html lang="ku">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KurdSub AI</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #0f172a;
      color: white;
      text-align: center;
      padding: 30px 15px;
    }
    h1 {
      font-size: 38px;
      margin-bottom: 10px;
    }
    p {
      color: #94a3b8;
    }
    .box {
      max-width: 700px;
      margin: 35px auto;
      background: #1e293b;
      padding: 25px;
      border-radius: 20px;
    }
    input {
      width: 100%;
      box-sizing: border-box;
      padding: 15px;
      border: none;
      border-radius: 10px;
      font-size: 16px;
      margin-bottom: 15px;
    }
    button {
      width: 100%;
      padding: 15px;
      border: none;
      border-radius: 10px;
      background: #22c55e;
      color: white;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
    }
    button:disabled {
      background: #64748b;
      cursor: not-allowed;
    }
    #status {
      margin-top: 20px;
      color: #22c55e;
      font-weight: bold;
    }
    #videoTitle {
      margin-top: 25px;
      font-size: 20px;
    }
    #transcript {
      margin-top: 20px;
      background: #0f172a;
      padding: 20px;
      border-radius: 12px;
      text-align: left;
      line-height: 1.8;
      white-space: pre-wrap;
      max-height: 500px;
      overflow-y: auto;
    }
  </style>
</head>
<body>
  <h1>🎬 KurdSub AI</h1>
  <p>ژێرنووسی ڤیدیۆکان بکە بە کوردی سۆرانی</p>
  <div class="box">
    <input
      id="youtubeUrl"
      type="text"
      placeholder="لینکی YouTube لێرە دابنێ..."
    >
    <button id="translateButton" onclick="getTranscript()">
      وەرگرتنی ژێرنووس
    </button>
    <div id="status"></div>
    <div id="videoTitle"></div>
    <div id="transcript"></div>
  </div>
  <script>
    async function getTranscript() {
      const input = document.getElementById("youtubeUrl");
      const button = document.getElementById("translateButton");
      const status = document.getElementById("status");
      const title = document.getElementById("videoTitle");
      const transcriptBox = document.getElementById("transcript");
      const videoUrl = input.value.trim();
      if (!videoUrl) {
        status.textContent = "❌ تکایە لینکی YouTube دابنێ.";
        return;
      }
      button.disabled = true;
      status.textContent = "⏳ ژێرنووسەکە وەردەگیرێت...";
      title.textContent = "";
      transcriptBox.textContent = "";
      try {
        const response = await fetch(
          "https://kurdishsub-ai.mahammadsaadi789.workers.dev/api?url=" +
          encodeURIComponent(videoUrl)
        );
        const data = await response.json();
        if (!data.success) {
          status.textContent = "❌ " + (data.error || "کێشەیەک ڕوویدا");
          return;
        }
        status.textContent = "✅ ژێرنووس بە سەرکەوتوویی وەرگیرا";
        title.textContent = "🎬 " + data.title;
        transcriptBox.textContent = data.translation;;
      } catch (error) {
        status.textContent =
          "❌ نەتوانرا پەیوەندی بە سێرڤەرەکەوە بکرێت.";
      } finally {
        button.disabled = false;
      }
    }
  </script>
</body>
</html>
